<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime World</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;

            background:
                radial-gradient(circle at 20% 20%, #7b2cff66, transparent 30%),
                radial-gradient(circle at 80% 80%, #00eaff55, transparent 30%),
                linear-gradient(135deg, #050014, #09001f, #00182b);
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(3px);
            animation: float 7s infinite ease-in-out;
            z-index: -1;
        }

        .orb1 {
            width: 200px;
            height: 200px;
            background: #7b2cff;
            left: 5%;
            top: 10%;
        }

        .orb2 {
            width: 250px;
            height: 250px;
            background: #00d9ff;
            right: 0;
            bottom: 0;
            animation-delay: 2s;
        }

        .orb3 {
            width: 100px;
            height: 100px;
            background: #ff00cc;
            right: 25%;
            top: 10%;
            animation-delay: 4s;
        }

        @keyframes float {
            50% {
                transform: translateY(-40px) scale(1.15);
            }
        }

        .container {
            width: 390px;
            padding: 35px;

            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 25px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 0 30px #7b2cff66,
                inset 0 0 20px #ffffff08;
        }

        .logo {
            text-align: center;
            font-size: 55px;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #00eaff;
            }

            to {
                text-shadow:
                    0 0 20px #ff00cc,
                    0 0 40px #00eaff;
            }
        }

        h1 {
            text-align: center;
            margin: 10px 0;
            font-size: 30px;

            background: linear-gradient(
                90deg,
                #00eaff,
                white,
                #ff00cc
            );

            -webkit-background-clip: text;
            color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        .input {
            margin: 15px 0;
        }

        .input input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #ffffff22;
            outline: none;

            background: #00000044;
            color: white;
        }

        .input input:focus {
            border-color: #00eaff;

            box-shadow:
                0 0 10px #00eaff88;
        }

        .password {
            position: relative;
        }

        .password span {
            position: absolute;
            right: 12px;
            top: 13px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;

            border: none;
            border-radius: 10px;

            color: white;
            font-weight: bold;
            font-size: 16px;

            cursor: pointer;

            background: linear-gradient(
                90deg,
                #6a00ff,
                #00c6ff,
                #ff00cc
            );

            background-size: 200%;

            transition: .4s;
        }

        button:hover {
            background-position: right;
            transform: translateY(-3px);

            box-shadow:
                0 0 20px #00eaff,
                0 0 30px #ff00cc55;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        .switch span {
            color: #00eaff;
            cursor: pointer;
            font-weight: bold;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        .dashboard {
            display: none;
            text-align: center;
        }

        .dashboard h2 {
            margin: 20px 0;
        }

        .user-info {
            padding: 15px;
            border-radius: 12px;
            background: #00000033;
            margin: 20px 0;
        }

        @media(max-width:500px) {
            .container {
                width: 90%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="container">

    <!-- LOGIN -->
    <div id="loginPage">

        <div class="logo">⚔️</div>

        <h1>ANIME LOGIN</h1>

        <p class="subtitle">
            Enter the Anime World
        </p>

        <div class="input">
            <input
                type="email"
                id="loginEmail"
                placeholder="📧 Email"
            >
        </div>

        <div class="input password">
            <input
                type="password"
                id="loginPassword"
                placeholder="🔒 Password"
            >

            <span onclick="showPassword('loginPassword')">
                👁️
            </span>
        </div>

        <button onclick="login()">
            ⚡ LOGIN
        </button>

        <div class="switch">
            Don't have an account?
            <span onclick="showRegister()">
                Register
            </span>
        </div>

        <div class="message" id="loginMessage"></div>

    </div>


    <!-- REGISTER -->

    <div id="registerPage" style="display:none">

        <div class="logo">✨</div>

        <h1>CREATE ACCOUNT</h1>

        <p class="subtitle">
            Become an Anime Warrior
        </p>

        <div class="input">
            <input
                type="text"
                id="registerName"
                placeholder="👤 Your Name"
            >
        </div>

        <div class="input">
            <input
                type="email"
                id="registerEmail"
                placeholder="📧 Email"
            >
        </div>

        <div class="input password">
            <input
                type="password"
                id="registerPassword"
                placeholder="🔒 Password"
            >

            <span onclick="showPassword('registerPassword')">
                👁️
            </span>
        </div>

        <div class="input password">
            <input
                type="password"
                id="confirmPassword"
                placeholder="🔒 Confirm Password"
            >
        </div>

        <button onclick="register()">
            ✨ CREATE ACCOUNT
        </button>

        <div class="switch">
            Already have an account?
            <span onclick="showLogin()">
                Login
            </span>
        </div>

        <div class="message" id="registerMessage"></div>

    </div>


    <!-- DASHBOARD -->

    <div id="dashboard" class="dashboard">

        <div class="logo">⚔️</div>

        <h1>WELCOME!</h1>

        <h2 id="welcomeName"></h2>

        <div class="user-info">

            <p id="userEmail"></p>

            <p style="margin-top:10px">
                🔥 Your account is active
            </p>

        </div>

        <button onclick="logout()">
            🚪 LOGOUT
        </button>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =====================================
   PUT YOUR FIREBASE CONFIG HERE
   ===================================== */

const firebaseConfig = {

    apiKey: "PASTE_YOUR_API_KEY",

    authDomain:
        "PASTE_YOUR_PROJECT.firebaseapp.com",

    projectId:
        "PASTE_YOUR_PROJECT_ID",

    storageBucket:
        "PASTE_YOUR_STORAGE_BUCKET",

    messagingSenderId:
        "PASTE_YOUR_MESSAGING_SENDER_ID",

    appId:
        "PASTE_YOUR_APP_ID"
};


/* =====================================
   INITIALIZE FIREBASE
   ===================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =====================================
   REGISTER
   ===================================== */

window.register = async function() {

    const name =
        document.getElementById("registerName").value.trim();

    const email =
        document.getElementById("registerEmail").value.trim();

    const password =
        document.getElementById("registerPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("registerMessage");


    if (!name || !email || !password) {

        message.innerText =
            "⚠️ Please fill all fields.";

        return;
    }


    if (password !== confirmPassword) {

        message.innerText =
            "❌ Passwords do not match.";

        return;
    }


    if (password.length < 6) {

        message.innerText =
            "❌ Password must be at least 6 characters.";

        return;
    }


    try {

        message.innerText =
            "⏳ Creating account...";


        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            result.user;


        /* Store profile in Firestore */

        await setDoc(
            doc(db, "users", user.uid),
            {

                name: name,

                email: email,

                createdAt: serverTimestamp()

            }
        );


        message.innerText =
            "✅ Account created successfully!";


    } catch(error) {

        console.error(error);

        message.innerText =
            "❌ " + getFirebaseError(error);

    }

};


/* =====================================
   LOGIN
   ===================================== */

window.login = async function() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("loginMessage");


    if (!email || !password) {

        message.innerText =
            "⚠️ Enter email and password.";

        return;
    }


    try {

        message.innerText =
            "⏳ Logging in...";


        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


    } catch(error) {

        console.error(error);

        message.innerText =
            "❌ " + getFirebaseError(error);

    }

};


/* =====================================
   LOGOUT
   ===================================== */

window.logout = async function() {

    await signOut(auth);

};


/* =====================================
   CHECK LOGIN STATE
   ===================================== */

onAuthStateChanged(auth, async (user) => {

    if (user) {

        document.getElementById("loginPage")
            .style.display = "none";

        document.getElementById("registerPage")
            .style.display = "none";

        document.getElementById("dashboard")
            .style.display = "block";


        document.getElementById("userEmail")
            .innerText =
            "📧 " + user.email;


        /* Get profile from Firestore */

        const profile =
            await getDoc(
                doc(db, "users", user.uid)
            );


        if (profile.exists()) {

            const data =
                profile.data();

            document.getElementById("welcomeName")
                .innerText =
                data.name;

        } else {

            document.getElementById("welcomeName")
                .innerText =
                "Warrior";

        }

    }

    else {

        document.getElementById("loginPage")
            .style.display = "block";

        document.getElementById("registerPage")
            .style.display = "none";

        document.getElementById("dashboard")
            .style.display = "none";

    }

});


/* =====================================
   ERROR MESSAGES
   ===================================== */

function getFirebaseError(error) {

    switch(error.code) {

        case "auth/email-already-in-use":
            return "Email already registered.";

        case "auth/invalid-email":
            return "Invalid email address.";

        case "auth/weak-password":
            return "Password is too weak.";

        case "auth/invalid-credential":
            return "Incorrect email or password.";

        case "auth/user-not-found":
            return "Account not found.";

        case "auth/wrong-password":
            return "Incorrect password.";

        default:
            return "Something went wrong.";

    }

}

</script>


<script>

/* =====================================
   UI FUNCTIONS
   ===================================== */

function showRegister() {

    document.getElementById("loginPage")
        .style.display = "none";

    document.getElementById("registerPage")
        .style.display = "block";
}


function showLogin() {

    document.getElementById("registerPage")
        .style.display = "none";

    document.getElementById("loginPage")
        .style.display = "block";
}


function showPassword(id) {

    const input =
        document.getElementById(id);

    input.type =
        input.type === "password"
        ? "text"
        : "password";
}

</script>

</body>
  </html>
